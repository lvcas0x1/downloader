# On a push to main that changes the app or how it is packaged: run the tests, build the app for
# Apple Silicon with its bundled binaries, package it as a DMG, and publish it as a GitHub release
# tagged v<version>. Only the newest release is kept.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Xcode 26.6 (default on macos-26) has the macOS 26 SDK the app needs:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write  # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Toolchain
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen --version

      # Pinned yt-dlp and Deno, each verified against a pinned SHA-256; ffmpeg and ffprobe built
      # from pinned, checksum-verified sources. Source archives are kept in build/sources/.
      - name: Fetch bundled binaries
        run: sh scripts/fetch-binaries.sh

      - name: Test
        run: |
          xcodegen generate --quiet
          xcodebuild test -project Downloader.xcodeproj -scheme DownloaderCore \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/dd-test -quiet

      # Next version: project.yml's MARKETING_VERSION major.minor, and a patch one above the highest
      # released patch for that major.minor (at least project.yml's patch).
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/next-version.sh "$(gh release list --limit 1000 --json tagName --jq '.[].tagName')" >> "$GITHUB_OUTPUT"

      # The "Downloader Code Signing" self-signed identity (the same one used for local builds) goes into
      # a temporary keychain, so every release keeps the same designated requirement.
      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$SIGNING_CERTIFICATE_P12" ]] || { echo "::error::secret SIGNING_CERTIFICATE_P12 is not set"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          print -rn -- "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" ${(f)"$(security list-keychains -d user | tr -d '" ')"}
          security find-identity -p codesigning "$keychain" | grep -q '"Downloader Code Signing"' \
            || { echo "::error::identity 'Downloader Code Signing' not found in the certificate"; exit 1; }
        shell: zsh {0}

      - name: Build app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Build DMG
        run: ./scripts/make-dmg.sh "${{ steps.version.outputs.version }}"

      # Sparkle's sign_update signs the DMG with the EdDSA key; the app checks it against
      # SUPublicEDKey before installing an update.
      - name: Build appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]] || { echo "::error::secret SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }
          sparkle="$RUNNER_TEMP/sparkle"
          mkdir -p "$sparkle"
          curl -fsSL --retry 3 --retry-all-errors -o "$sparkle/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $sparkle/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$sparkle/sparkle.tar.xz" -C "$sparkle" ./bin/sign_update
          SIGN_UPDATE="$sparkle/bin/sign_update" ./scripts/make-appcast.sh "$VERSION" "$BUILD_NUMBER" \
            "build/Downloader-$VERSION.dmg" "https://github.com/lvcas0x1/downloader/releases/download/v$VERSION/Downloader-$VERSION.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The source archives of the bundled GPL/LGPL programs are published with the DMG
          # (GPLv3 section 6(d), LGPL-2.1 section 4).
          gh release create "v$VERSION" "build/Downloader-$VERSION.dmg" build/appcast.xml build/sources/* \
            --target "$GITHUB_SHA" \
            --title "Downloader $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Apple Silicon, macOS 14 or later.

          The app is signed with a self-signed certificate and not notarized. After copying it to
          Applications for the first time, open it once, then allow it in System Settings > Privacy &
          Security > Open Anyway. Later versions install through the menu-bar menu (Update).

          Bundled third-party programs (unmodified, run as separate processes):
          - yt-dlp (yt-dlp_macos): GPLv3+ as a whole (yt-dlp itself is Unlicense; the build includes GPL code)
          - FFmpeg (ffmpeg, ffprobe), built from source with LAME: LGPL-2.1-or-later
          - Deno: MIT

          Corresponding source: the yt-dlp, FFmpeg, and LAME source archives and build-ffmpeg.sh
          are attached to this release. License texts and details: Contents/Resources/bin/licenses/
          and Contents/Resources/bin/THIRD_PARTY_NOTICES.md in the app."

      # Keep only the newest release; delete older ones together with their tags.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:][] | .tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done

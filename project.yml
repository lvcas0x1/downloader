name: Downloader
options:
  bundleIdPrefix: com.lvcas0x1
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # In-app updates.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  DownloaderCore:
    type: framework
    platform: macOS
    sources:
      - Sources/DownloaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lvcas0x1.downloader.core
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets:
        - DownloaderCoreTests
      gatherCoverageData: false
  Downloader:
    type: application
    platform: macOS
    sources:
      - Sources/Downloader
      - path: Resources/bin
        type: folder
        buildPhase: resources
    dependencies:
      - target: DownloaderCore
        embed: true
      - package: Sparkle
    info:
      path: Sources/Downloader/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleName: Downloader
        CFBundleDisplayName: Downloader
        LSMinimumSystemVersion: "14.0"
        SUFeedURL: https://github.com/lvcas0x1/downloader/releases/latest/download/appcast.xml
        SUPublicEDKey: FntBnjJ4m2AjwWeM56A1c6yepS1RqFPCsCZj2QzSvjo=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lvcas0x1.downloader
        # Off: with a self-signed certificate (no Team ID), library validation would reject the
        # embedded frameworks. There is no notarization, which is what would require it.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
  DownloaderCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DownloaderCoreTests
    dependencies:
      - target: DownloaderCore
